<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="notes.css">
</head>
<body>
    <section>
        <header class="header">
            <h1>Note App</h1>
            <button type="button">Logout</button>
        </header>
        <div class="notes-bar">
            <p>My Notes</p>
            <button type="button">+ New Note</button>
        </div>
        <div class="notes-container">
            <div class="note-card">
                <div class="top-section">
                    <h2>History</h2>
                    <button>:</button>
                </div>
                <div class="content">
                    I really loved being in history class
                </div>
            </div>
            
        </div>
    </section>
</body>
</html>
